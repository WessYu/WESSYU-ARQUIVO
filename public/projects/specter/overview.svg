      <text x="22" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#efefec">BUILD / REMOTE</text>
      <text x="714" y="35" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#9da2a6">headers · cookies · CSP</text>
