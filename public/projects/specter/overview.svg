      <rect width="736" height="58" rx="14" fill="#0b0d0e" stroke="#2a2d30"/>
      <text x="22" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#efefec">ACTIVE SECURITY</text>
      <text x="714" y="35" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#9da2a6">authorized · bounded · non-destructive</text>
    </g>

