  <text x="56" y="315" font-family="Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-4" fill="#f1f1ef">SPECTER</text>
  <text x="58" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2.4" fill="#8f9499">APPLICATION SECURITY</text>
  <text x="58" y="402" font-family="Arial, sans-serif" font-size="18" fill="#c2c5c7">Detect regressions before they ship.</text>
  <text x="58" y="430" font-family="Arial, sans-serif" font-size="18" fill="#c2c5c7">Validate deployed apps with explicit boundaries.</text>

  <g transform="translate(432 104)">
    <rect width="804" height="438" rx="26" fill="#111315" stroke="#2b2e31"/>
    <text x="34" y="42" font-family="Courier New, monospace" font-size="14" fill="#aeb3b7">$ specter scan . --active --ci</text>

    <g transform="translate(34 76)">
      <rect width="736" height="58" rx="14" fill="#0b0d0e" stroke="#2a2d30"/>
      <text x="22" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#efefec">SOURCE</text>
      <text x="714" y="35" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#9da2a6">0 high · 2 medium</text>
    </g>
    <g transform="translate(34 146)">
      <rect width="736" height="58" rx="14" fill="#0b0d0e" stroke="#2a2d30"/>
      <text x="22" y="35" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#efefec">DEPENDENCIES</text>
      <text x="714" y="35" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#9da2a6">provider checked</text>
