    <text x="34" y="406" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8" fill="#858b90">SECURITY SCORE</text>
    <text x="238" y="408" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#efefec">94 / 100</text>
    <text x="770" y="406" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#efefec">CI GATE PASSED</text>
