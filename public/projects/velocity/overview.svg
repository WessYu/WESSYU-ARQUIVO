<svg xmlns="http://www.w3.org/2000/svg" width="1292" height="660" viewBox="0 0 1292 660" role="img" aria-labelledby="title desc">
  <title id="title">Velocity CLI</title>
  <desc id="desc">Developer tool for performance diagnostics, benchmarks, comparisons and safe optimization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11141d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ff5a"/>
      <stop offset="1" stop-color="#7ce3ff"/>
    </linearGradient>
  </defs>
  <rect width="1292" height="660" fill="#050608"/>
  <rect x="42" y="40" width="1208" height="580" rx="24" fill="url(#bg)" stroke="#2a2e39"/>
  <rect x="42" y="40" width="1208" height="58" rx="24" fill="#151821"/>
  <rect x="42" y="74" width="1208" height="24" fill="#151821"/>
  <circle cx="76" cy="69" r="7" fill="#ff6b67"/>
  <circle cx="99" cy="69" r="7" fill="#f4bd4f"/>
  <circle cx="122" cy="69" r="7" fill="#53d17f"/>
  <text x="154" y="75" fill="#777f90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">velocity / terminal</text>

  <text x="88" y="148" fill="#7d8597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">$ npx @wess2001/velocity analyze .</text>
  <text x="88" y="197" fill="#f3f5f7" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">VELOCITY</text>
  <rect x="88" y="218" width="240" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="88" y="258" fill="#9aa2b2" font-family="Inter, Arial, sans-serif" font-size="18">Performance diagnostics for JavaScript &amp; TypeScript projects</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="88" y="318" fill="#b8ff5a">✓</text><text x="118" y="318" fill="#d7dce6">Build analyzed</text><text x="350" y="318" fill="#727b8e">42 assets</text>
    <text x="88" y="354" fill="#b8ff5a">✓</text><text x="118" y="354" fill="#d7dce6">Runtime profile captured</text><text x="350" y="354" fill="#727b8e">Chromium</text>
    <text x="88" y="390" fill="#ffcf66">!</text><text x="118" y="390" fill="#d7dce6">Largest artifact</text><text x="350" y="390" fill="#ffcf66">312 KB</text>
    <text x="88" y="426" fill="#7ce3ff">→</text><text x="118" y="426" fill="#d7dce6">Suggested next step</text><text x="350" y="426" fill="#7ce3ff">velocity compare</text>
  </g>

  <rect x="750" y="144" width="430" height="338" rx="20" fill="#0d1017" stroke="#282d39"/>
  <text x="784" y="184" fill="#7d8597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">BENCHMARK SUMMARY</text>
  <text x="784" y="238" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="700">842 ms</text>
  <text x="784" y="266" fill="#7d8597" font-family="Inter, Arial, sans-serif" font-size="15">median load</text>
  <line x1="784" y1="296" x2="1145" y2="296" stroke="#252a35"/>
  <text x="784" y="335" fill="#9aa2b2" font-family="Inter, Arial, sans-serif" font-size="15">p95</text>
  <text x="1085" y="335" text-anchor="end" fill="#f4f6f8" font-family="ui-monospace, monospace" font-size="16">1.12 s</text>
  <text x="784" y="374" fill="#9aa2b2" font-family="Inter, Arial, sans-serif" font-size="15">instability</text>
  <text x="1085" y="374" text-anchor="end" fill="#b8ff5a" font-family="ui-monospace, monospace" font-size="16">low</text>
  <text x="784" y="413" fill="#9aa2b2" font-family="Inter, Arial, sans-serif" font-size="15">environment</text>
  <text x="1085" y="413" text-anchor="end" fill="#f4f6f8" font-family="ui-monospace, monospace" font-size="16">matched</text>
  <rect x="784" y="444" width="152" height="28" rx="14" fill="#172418" stroke="#2e5032"/>
  <text x="860" y="463" text-anchor="middle" fill="#b8ff5a" font-family="ui-monospace, monospace" font-size="12">SAFE TO COMPARE</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="88" y="507" width="190" height="36" rx="10" fill="#111722" stroke="#252d3a"/><text x="183" y="530" text-anchor="middle" fill="#cdd3df">analyze</text>
    <rect x="290" y="507" width="190" height="36" rx="10" fill="#111722" stroke="#252d3a"/><text x="385" y="530" text-anchor="middle" fill="#cdd3df">compare</text>
    <rect x="492" y="507" width="190" height="36" rx="10" fill="#111722" stroke="#252d3a"/><text x="587" y="530" text-anchor="middle" fill="#cdd3df">optimize</text>
    <rect x="694" y="507" width="190" height="36" rx="10" fill="#111722" stroke="#252d3a"/><text x="789" y="530" text-anchor="middle" fill="#cdd3df">verify</text>
  </g>
  <text x="88" y="585" fill="#626b7b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">measure → compare → optimize → verify</text>
</svg>
