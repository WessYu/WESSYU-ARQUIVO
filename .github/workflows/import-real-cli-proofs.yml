name: Import Real CLI Proofs

on:
  push:
    branches: [fix/import-real-cli-proofs]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-real-cli-proofs

      - name: Download exact public workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cli-proofs

          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-ec18-820e-90f1-b7280a754613/raw?se=2026-09-22T12%3A05%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=34fdd538-b02d-5363-9719-edfa11be98a6&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T10%3A04%3A47Z&ske=2026-09-23T10%3A04%3A47Z&sks=b&skv=2026-02-06&sig=rcsirhhYLqeUeXM3ANXQnnIFsVXYKUTU4bfuZ/4Do0k%3D' -o /tmp/cli-proofs/nexus.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1228-820e-8add-116b36561070/raw?se=2026-09-22T12%3A05%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=b3d5367b-3b15-58c0-9dee-b9a2bc9d141e&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T11%3A05%3A57Z&ske=2026-09-23T11%3A05%3A57Z&sks=b&skv=2026-02-06&sig=YpJJN0tMlMccYoNHNJBoOgNsOZXbZG8nkZtuJTDW8as%3D' -o /tmp/cli-proofs/component-vault.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5294-820e-b727-ec721fb61de4/raw?se=2026-09-22T12%3A05%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=bd0eea12-8a47-5bfb-9880-5461d744cbbb&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T10%3A34%3A50Z&ske=2026-09-23T10%3A34%3A50Z&sks=b&skv=2026-02-06&sig=XpyVO9fJNXDVX5O/jEOxcGNDO%2Bl1OwBn1I3ZFy5DOOo%3D' -o /tmp/cli-proofs/velocity.zip
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5994-820e-9950-e79143c00552/raw?se=2026-09-22T12%3A05%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=1a94a021-9633-5cb4-b92e-cbcc9847b0d7&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T11%3A51%3A51Z&ske=2026-09-23T11%3A51%3A51Z&sks=b&skv=2026-02-06&sig=wXzDhEd5pV9U7NF16YVtXdvb12oReJLNJLt12sAPtC4%3D' -o /tmp/cli-proofs/specter.zip

      - name: Replace rendered proofs with actual terminal PNGs
        shell: bash
        run: |
          set -euo pipefail
          for name in nexus component-vault velocity specter; do
            mkdir -p "/tmp/cli-proofs/$name"
            unzip -q "/tmp/cli-proofs/$name.zip" -d "/tmp/cli-proofs/$name"
            test -s "/tmp/cli-proofs/$name/terminal.png"
            cp "/tmp/cli-proofs/$name/terminal.png" "public/projects/$name/proof.png"
            rm -f "public/projects/$name/proof.svg"
          done

          file public/projects/nexus/proof.png
          file public/projects/component-vault/proof.png
          file public/projects/velocity/proof.png
          file public/projects/specter/proof.png

      - name: Commit exact screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/*/proof.png public/projects/*/proof.svg
          if git diff --cached --quiet; then
            echo "No proof changes to commit."
            exit 0
          fi
          git commit -m "fix(portfolio): use actual terminal screenshots"
          git push origin HEAD:fix/import-real-cli-proofs
