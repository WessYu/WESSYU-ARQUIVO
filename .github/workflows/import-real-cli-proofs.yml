name: Import Real CLI Proofs

on:
  push:
    branches: [fix/import-real-cli-proofs]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-real-cli-proofs

      - name: Download exact public workflow artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cli-proofs

          download_artifact() {
            local repo="$1"
            local id="$2"
            local out="$3"
            curl -fL               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               -A "WESSYU-ARQUIVO-proof-import"               "https://api.github.com/repos/WessYu/$repo/actions/artifacts/$id/zip"               -o "$out"
          }

          download_artifact "NEXUS" 10691929794 /tmp/cli-proofs/nexus.zip
          download_artifact "component-vault" 10693060282 /tmp/cli-proofs/component-vault.zip
          download_artifact "velocity" 10692424883 /tmp/cli-proofs/velocity.zip
          download_artifact "SPECTER" 10693420160 /tmp/cli-proofs/specter.zip

      - name: Replace rendered proofs with actual terminal PNGs
        shell: bash
        run: |
          set -euo pipefail
          for name in nexus component-vault velocity specter; do
            mkdir -p "/tmp/cli-proofs/$name"
            unzip -q "/tmp/cli-proofs/$name.zip" -d "/tmp/cli-proofs/$name"
            test -s "/tmp/cli-proofs/$name/terminal.png"
            cp "/tmp/cli-proofs/$name/terminal.png" "public/projects/$name/proof.png"
            rm -f "public/projects/$name/proof.svg"
          done

          file public/projects/nexus/proof.png
          file public/projects/component-vault/proof.png
          file public/projects/velocity/proof.png
          file public/projects/specter/proof.png

      - name: Commit exact screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects/*/proof.png public/projects/*/proof.svg
          if git diff --cached --quiet; then
            echo "No proof changes to commit."
            exit 0
          fi
          git commit -m "fix(portfolio): use actual terminal screenshots"
          git push origin HEAD:fix/import-real-cli-proofs
